networks:
  default:
    driver: bridge
    name: roboshop
    # external: true  # Uncomment only if the 'roboshop' network already exists

services:
  mongodb:
    image: karna0323/mongodb:v1
    container_name: mongodb

  catalogue:
    image: karna0323/catalogue:v1
    container_name: catalogue  # ✅ Fixed typo: 'contaoner_name' → 'container_name'
    depends_on:
      - mongodb

  redis:
    image: redis:7.0
    container_name: redis

  user:
    image: karna0323/user:v1
    container_name: user
    depends_on:
      - redis
      - mongodb

  cart:
    image: karna0323/cart:v1
    container_name: cart
    depends_on:
      - catalogue
      - redis

  mysql:
    image: karna0323/mysql:v1
    container_name: mysql

  shipping:
    image: karna0323/shipping:v1
    container_name: shipping
    depends_on:
      - mysql
      - cart


